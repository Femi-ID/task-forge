minio:
  image: minio/minio
  ports:
    - "9000:9000"   # S3 API port — what your .NET code talks to
    - "9001:9001"   # web console — browser UI for poking at buckets
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
  command: server /data --console-address ":9001"
  volumes:
    - minio-data:/data
volumes:
  minio-data: